name: TimeIn
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
packages:
  TimeInKit:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  TimeIn:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [App]
    dependencies:
      - package: TimeInKit
        product: CRMCore
      - package: TimeInKit
        product: CRMPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobsoncarlos.timein
        PRODUCT_NAME: TimeIn
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Time In
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your private client command center.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1,2'
  TimeInUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UITests]
    dependencies:
      - target: TimeIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobsoncarlos.timein.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TimeIn:
    build:
      targets:
        TimeIn: all
    test:
      targets: [TimeInUITests]
    run:
      config: Debug
  TimeIn-Demo:
    build:
      targets:
        TimeIn: all
    run:
      config: Debug
      commandLineArguments:
        '--demo': true
